# Production has introspection disabled: run general-strapi locally (npm run develop) to regenerate.
schema: ${GENERAL_STRAPI_URL:http://localhost:1337}/graphql
documents: "./graphql/queries/**/*.{gql,graphql}"
generates:
  graphql/index.ts:
    plugins:
      - typescript
      - typescript-operations
      - typescript-react-query
    config:
      fetcher: "../src/utils/fetcher#fetcher"
