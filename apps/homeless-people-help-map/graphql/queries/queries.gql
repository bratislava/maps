query LinkyPomoci($locale: I18NLocaleCode!) {
  linkyPomocis(locale: $locale, sort: "Nazov:asc") {
    documentId
    Cena
    Email
    Nazov
    Popis
    Prevadzka
    Prevadzkovatel
    Telefon
    createdAt
    locale
    publishedAt
    updatedAt
  }
}

query Fixpointy($locale: I18NLocaleCode!) {
  fixpoints(locale: $locale) {
    documentId
    Adresa
    Latitude
    Longitude
    Nazov
    createdAt
  }
}

query TerenneSluzby($locale: I18NLocaleCode!) {
  terenneSluzbies(locale: $locale, sort: "Nazov:asc") {
    documentId
    Cena_kapacita
    Dostupnost
    Lokalita_posobnosti
    Nazov
    Poskytovatel
    Sluzba
    Telefon
  }
}

query SluzbyPreLudiBezDomova($locale: I18NLocaleCode!) {
  sluzbyPreLudiBezDomovas(locale: $locale) {
    documentId
    Adresa
    Cas
    Email
    Kontaktne_centrum
    Hygiena_osatenie
    Kultura
    Latitude
    Longitude
    Mestska_cast
    Navigacia
    Navigovat
    Nazov
    Noclah_ubytovanie
    Popis
    Poskytovatel
    Socialne_pravne_poradenstvo
    Strava
    Subor {
      documentId
      url
    }
    Tagy
    Telefon
    Telefon_popis
    Web
    Zdravotne_osetrenie
  }
}

query PitneFontanky($locale: I18NLocaleCode!) {
  pitneFontankies(locale: $locale) {
    documentId
    Fotky {
      documentId
      url
    }
    Latitude
    Longitude
    Nazov
    Rok_spustenia
    Spravca
    Stav
    Typ
  }
}
